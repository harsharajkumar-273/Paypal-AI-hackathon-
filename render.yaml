# Deploy this Blueprint from your public GitHub repository.
# Set APP_URL to the final web-service HTTPS origin before using payment redirects.
services:
  - type: web
    name: proofpay
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: RUN_WORKER
        value: 'false'
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: proofpay-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DEVELOPER_INVITE
        generateValue: true
      - key: BUYER_INVITE
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_FORM_ENDPOINTS
        sync: false
  - type: worker
    name: proofpay-browser
    runtime: docker
    plan: 1c-2g
    dockerCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proofpay-db
          property: connectionString
      - key: FIXTURE_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_FORM_ENDPOINTS
        sync: false
databases:
  - name: proofpay-db
    plan: 0.1c-256mb
    ipAllowList: []
    databaseName: proofpay
    user: proofpay
